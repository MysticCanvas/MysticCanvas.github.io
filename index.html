<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض MysticCanvas</title>
    <style>
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            font-family: Arial, Tahoma, sans-serif;
            background: radial-gradient(circle at top, #252525 0%, #111 45%, #080808 100%);
            color: #fff;
            min-height: 100vh;
        }
        header { text-align: center; padding: 55px 20px 35px; }
        header h1 {
            margin: 0 0 12px;
            font-size: clamp(32px, 6vw, 60px);
            letter-spacing: 2px;
            color: #f5f5f5;
            text-shadow: 0 0 20px rgba(255,255,255,.15);
        }
        header p {
            margin: 0 auto;
            max-width: 650px;
            color: #aaa;
            font-size: 16px;
            line-height: 1.8;
        }
        .line {
            width: 90px; height: 3px; background: #e63946;
            margin: 25px auto 0; border-radius: 10px;
        }
        .gallery {
            width: min(1200px, 92%);
            margin: 10px auto 60px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }
        .gallery-item {
            position: relative;
            overflow: hidden;
            background: #181818;
            border: 1px solid #333;
            border-radius: 14px;
            padding: 8px;
            cursor: pointer;
            transition: transform .35s ease, border-color .35s ease, box-shadow .35s ease;
        }
        .gallery-item:hover {
            transform: translateY(-7px);
            border-color: #e63946;
            box-shadow: 0 15px 40px rgba(0,0,0,.5);
        }
        .gallery-item img {
            width: 100%;
            height: 360px;
            object-fit: cover;
            display: block;
            border-radius: 9px;
            transition: transform .5s ease;
        }
        .gallery-item:hover img { transform: scale(1.04); }
        .caption {
            padding: 14px 8px 10px;
            text-align: center;
            color: #ddd;
            font-size: 15px;
        }
        .portrait img { object-position: center top; }
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.92);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 30px;
            z-index: 9999;
        }
        .lightbox.active { display: flex; }
        .lightbox img {
            max-width: 95vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(0,0,0,.8);
        }
        .close {
            position: fixed;
            top: 18px;
            left: 25px;
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,.12);
            color: white;
            font-size: 30px;
            line-height: 45px;
            cursor: pointer;
            transition: background .25s ease;
        }
        .close:hover { background: #e63946; }
        footer {
            text-align: center;
            padding: 25px 20px 35px;
            color: #777;
            font-size: 14px;
            border-top: 1px solid #222;
        }
        @media (max-width: 600px) {
            header { padding-top: 40px; }
            .gallery {
                width: 94%;
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .gallery-item img {
                height: auto;
                max-height: 600px;
                object-fit: contain;
            }
            .lightbox { padding: 15px; }
            .close { top: 12px; left: 12px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>MysticCanvas</h1>
        <p>معرض للأعمال الفنية والتصاميم الغامضة، حيث تلتقي الخيالات والأساطير والفن في مساحة واحدة.</p>
        <div class="line"></div>
    </header>

    <main class="gallery">
        <div class="gallery-item portrait" onclick="openLightbox('images/elf.jpg')">
            <img src="images/elf.jpg" alt="فتاة الإلف ذات القرون" loading="lazy">
            <div class="caption">فتاة الإلف ذات القرون</div>
        </div>

        <div class="gallery-item portrait" onclick="openLightbox('images/hiphop.jpg')">
            <img src="images/hiphop.jpg" alt="تصميم HIP-HOP" loading="lazy">
            <div class="caption">HIP-HOP</div>
        </div>

        <div class="gallery-item portrait" onclick="openLightbox('images/mary.jpg')">
            <img src="images/mary.jpg" alt="السيدة بالرداء الأزرق والزهرة البيضاء" loading="lazy">
            <div class="caption">السيدة والزهرة البيضاء</div>
        </div>

        <div class="gallery-item portrait" onclick="openLightbox('images/painting.jpg')">
            <img src="images/painting.jpg" alt="لوحة كلاسيكية خيالية" loading="lazy">
            <div class="caption">اللوحة الكلاسيكية</div>
        </div>

        <div class="gallery-item portrait" onclick="openLightbox('images/elf2.jpg')">
            <img src="images/elf2.jpg" alt="فتاة الإلف - نسخة ثانية" loading="lazy">
            <div class="caption">فتاة الإلف — نسخة ثانية</div>
        </div>
    </main>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <button class="close" aria-label="إغلاق" onclick="closeLightbox()">×</button>
        <img id="lightboxImage" src="" alt="صورة مكبرة" onclick="event.stopPropagation()">
    </div>

    <footer>© 2026 MysticCanvas — جميع الحقوق محفوظة</footer>

    <script>
        function openLightbox(imageSrc) {
            document.getElementById("lightboxImage").src = imageSrc;
            document.getElementById("lightbox").classList.add("active");
            document.body.style.overflow = "hidden";
        }

        function closeLightbox() {
            document.getElementById("lightbox").classList.remove("active");
            document.getElementById("lightboxImage").src = "";
            document.body.style.overflow = "";
        }

        document.addEventListener("keydown", function(event) {
            if (event.key === "Escape") closeLightbox();
        });
    </script>
</body>
</html>
